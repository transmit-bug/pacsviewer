# E2E Gate — 1.0 release gate scenarios S1–S7 (issue #141)
#
# Fresh-DB harness: every run gets a brand-new SQLite database
# (temp DATABASE_URL + db:push + db:seed with a deterministic
# INITIAL_ADMIN_PASSWORD) and synthetic fixtures only.
# See playwright.config.ts + tests/e2e/global-setup.ts.

name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BUN_VERSION: 'latest'
  INITIAL_ADMIN_PASSWORD: 'admin123'
  E2E_API_PORT: '3100'
  E2E_WEB_PORT: '5180'

jobs:
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright chromium (+ system deps)
        run: bunx playwright install --with-deps chromium

      - name: Run E2E gate suite (fresh DB, ports 3100/5180)
        run: bunx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces/screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_number }}
          path: |
            test-results/
          retention-days: 7
